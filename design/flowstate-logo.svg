<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Flowstate — f(s): flow as a function of speech.
       Math-typeset hero (italic variables, roman parentheses, LaTeX-style)
       over the function's own curve: tight speech ripples settling into one
       serene swell, landing on a dot (the text, placed).
       Monochrome menu-bar glyph: export #fs alone, or #wave + #dot. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1740"/>
      <stop offset="0.55" stop-color="#2b2170"/>
      <stop offset="1" stop-color="#0e3a5c"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa8ff"/>
      <stop offset="0.55" stop-color="#cfd8ff"/>
      <stop offset="1" stop-color="#7ee6d4"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#8f9dff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#8f9dff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- macOS-style tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#halo)"/>

  <!-- the function's curve: speech ripples → one serene swell -->
  <path id="wave"
        d="M 88 372
           C 99 344, 108 344, 119 372  C 130 400, 139 400, 150 372
           C 163 338, 177 338, 190 372 C 203 406, 217 406, 230 372
           C 261 308, 305 308, 336 372"
        fill="none" stroke="url(#stroke)"
        stroke-width="22" stroke-linecap="round"/>
  <circle id="dot" cx="372" cy="398" r="16" fill="#7ee6d4"/>

  <!-- f(s) — math-typeset: italic f and s, roman parentheses -->
  <text id="fs" x="256" y="262" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="216"
        fill="#eef1ff">
    <tspan font-style="italic">f</tspan><tspan dx="6" font-style="normal">(</tspan><tspan dx="2" font-style="italic">s</tspan><tspan dx="4" font-style="normal">)</tspan>
  </text>
</svg>
